name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Check whether this repository defines a Conda environment
      id: conda-config
      run: |
        if test -f environment.yml; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Conda tests skipped: no environment.yml exists in this repository. This is not a green test result." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Add conda to system path
      if: steps.conda-config.outputs.configured == 'true'
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      if: steps.conda-config.outputs.configured == 'true'
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      if: steps.conda-config.outputs.configured == 'true'
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      if: steps.conda-config.outputs.configured == 'true'
      run: |
        conda install pytest
        pytest

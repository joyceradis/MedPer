name: Regression audit

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - 'app.html'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/regression-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - 'app.html'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/regression-audit.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Run canonical regression suite
        run: |
          set -euo pipefail
          npm test

      - name: Verify application entrypoints and storage ownership
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.html').read_text(encoding='utf-8')
          public = Path('index.html').read_text(encoding='utf-8')
          js_files = list(Path('js').rglob('*.js'))

          def local_path(ref): return ref.split('?', 1)[0].split('#', 1)[0]
          scripts = [local_path(ref) for ref in re.findall(r'<script[^>]+src="([^"]+)"', app)]
          if scripts != ['./js/v2/app.js']:
              raise SystemExit(f'Unexpected V2 app entrypoints: {scripts}')
          if './js/v2/app.js' in public or './js/main.js' in public:
              raise SystemExit('Public home must not load the internal application.')

          storage_owners = sorted(str(path) for path in js_files if 'localStorage.' in path.read_text(encoding='utf-8'))
          allowed = sorted(['js/core/store.js','js/v2/repository.js'])
          if storage_owners != allowed:
              raise SystemExit(f'Unexpected localStorage ownership: {storage_owners}; expected {allowed}')

          forbidden = ['MutationObserver', 'window.MedPer', 'window.MedPerMethodology']
          combined = '\n'.join(path.read_text(encoding='utf-8') for path in js_files)
          found = [item for item in forbidden if item in combined]
          if found:
              raise SystemExit(f'Forbidden architecture patterns found: {found}')

          print('V2 entrypoint, storage ownership and modular architecture validated.')
          PY

      - name: Verify legacy knowledge compatibility and V2 canonical model
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          store = Path('js/core/store.js').read_text(encoding='utf-8')
          engine = Path('js/methodology/engine.js').read_text(encoding='utf-8')
          legacy_app = Path('js/ui/app.js').read_text(encoding='utf-8')
          v2_model = Path('js/v2/case-record.js').read_text(encoding='utf-8')
          v2_app = Path('js/v2/app.js').read_text(encoding='utf-8')

          required_store=['synchronizePericialObject','caseData.methodology.general.object','caseData.scope = canonical','normalizeState(next, state)']
          missing=[item for item in required_store if item not in store]
          if missing: raise SystemExit(f'Legacy migration safeguards missing: {missing}')
          if "has(g,'object')" not in engine: raise SystemExit('Legacy methodology canonical-object audit missing.')
          if not re.search(r"\b(?:textarea|bareField)\('scope'", legacy_app):
              raise SystemExit('Legacy scope compatibility binding changed unexpectedly.')

          required_v2=['schemaVersion: SCHEMA_VERSION','sources: []','timeline: []','evidenceClaims: []','questions: []','analysis:','conclusion:']
          missing=[item for item in required_v2 if item not in v2_model]
          if missing: raise SystemExit(f'V2 canonical CaseRecord incomplete: {missing}')
          for token in ['routeMethodology','AIPE_CRITERIA','POSAS_PATIENT_ITEMS','composeCaseDocument']:
              if token not in v2_app: raise SystemExit(f'V2 integration missing: {token}')
          print('Legacy medico-legal knowledge remains available and V2 canonical case model is wired.')
          PY

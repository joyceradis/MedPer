name: Backend tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      MEDPER_DATABASE_URL: sqlite:///./test_medper.db
      MEDPER_JWT_SECRET: test-secret-that-is-longer-than-32-bytes
      MEDPER_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Lock sincronizado com requirements.in
        run: |
          pip install pip-tools==7.6.2
          pip-compile --quiet --no-emit-index-url --strip-extras --output-file=requirements.txt requirements.in
          git diff --exit-code requirements.txt || {
            echo "::error file=backend/requirements.txt::requirements.txt fora de sincronia com requirements.in. Rode, em backend/ com Python 3.13: pip-compile --no-emit-index-url --strip-extras --output-file=requirements.txt requirements.in"
            exit 1
          }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q -k 'not postgres_rls'

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medper
          POSTGRES_USER: medper_owner
          POSTGRES_PASSWORD: owner-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medper_owner -d medper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PGPASSWORD: owner-test-password
      MEDPER_JWT_SECRET: postgres-test-secret-that-is-longer-than-32-bytes
      MEDPER_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create restricted application role
        run: psql -v ON_ERROR_STOP=1 -h localhost -U medper_owner -d medper -f scripts/init_database.sql
      - name: Apply migrations as owner
        env:
          MEDPER_DATABASE_URL: postgresql+psycopg://medper_owner:owner-test-password@localhost:5432/medper
        run: alembic upgrade head
      - name: Apply grants and RLS
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U medper_owner -d medper -f scripts/restrict_audit.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U medper_owner -d medper -f scripts/enable_rls.sql
      - name: Run PostgreSQL integration test as restricted role
        env:
          MEDPER_DATABASE_URL: postgresql+psycopg://medper_app:dev-app-password@localhost:5432/medper
          MEDPER_POSTGRES_TEST: '1'
        run: pytest -q tests/test_postgres_integration.py tests/test_case_owner_isolation.py

  backup-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: medper_drill
          POSTGRES_PASSWORD: disposable-drill-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medper_drill -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      MEDPER_BACKUP_TEST: '1'
      MEDPER_RESTORE_TEST_ADMIN_URL: postgresql://medper_drill:disposable-drill-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y age postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: pip install -r requirements.txt
      - name: Restore encrypted database and files into disposable databases
        run: pytest -q tests/test_backup_restore_integration.py

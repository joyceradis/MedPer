name: Governance remediation PR 86

on:
  push:
    branches:
      - claude/platform-maturity-analysis-aniroa

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/platform-maturity-analysis-aniroa
      - name: Apply targeted security and regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_required(
              'js/methodology/functional-calc.js',
              "String(value ?? '').trim();\n\n// \"12,5%\", \"12.5\", \" 12 % \" → 12.5. Devolve null para vazio ou ilegível — a\n// distinção entre \"não preenchido\" e \"zero\" importa: zero é uma declaração.\nexport function parsePercent(value) {\n  const bruto = texto(value).replace('%', '').replace(',', '.').trim();",
              "String(value ?? '').trim();\n\n// \"12,5%\", \"12.5\", \" 12 % \" → 12.5. Devolve null para vazio ou ilegível — a\n// distinção entre \"não preenchido\" e \"zero\" importa: zero é uma declaração.\nexport function parsePercent(value) {\n  const bruto = texto(value).replaceAll('%', '').replace(',', '.').trim();"
          )

          p = Path('js/ui/app.js')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ("'\\\"':'&quot'", "'\\\"':'&quot;'"),
              ("value=\"${wizard.noticedAt||''}\"", "value=\"${esc(wizard.noticedAt||'')}\""),
              ('persistido em localStorage. O que', 'persistido em armazenamento local. O que'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected app.js fragment not found: {old!r}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Regression and focused security tests
        run: |
          set -euo pipefail
          node --check js/ui/app.js
          node --check js/methodology/functional-calc.js
          node tests/store-regression.test.mjs
          node tests/functional-calc-regression.test.mjs
          python - <<'PY'
          from pathlib import Path
          js_files = list(Path('js').rglob('*.js'))
          owners = [str(p) for p in js_files if 'localStorage.' in p.read_text(encoding='utf-8')]
          if owners != ['js/core/store.js']:
              raise SystemExit(f'localStorage ownership regression remains: {owners}')
          app = Path('js/ui/app.js').read_text(encoding='utf-8')
          if 'value="${wizard.noticedAt||\'\'}"' in app:
              raise SystemExit('Unescaped wizard date remains in innerHTML sink')
          if "replace('%', '')" in Path('js/methodology/functional-calc.js').read_text(encoding='utf-8'):
              raise SystemExit('Incomplete percent replacement remains')
          print('Targeted governance checks passed.')
          PY
      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo 'No remediation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/app.js js/methodology/functional-calc.js
          git commit -m 'fix: remediate PR 86 security and regression findings'
          git push origin HEAD:claude/platform-maturity-analysis-aniroa

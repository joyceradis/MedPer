name: Governance remediation PR 86

on:
  push:
    branches:
      - claude/platform-maturity-analysis-aniroa

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude/platform-maturity-analysis-aniroa
      - name: Apply targeted security and regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          functional = Path('js/methodology/functional-calc.js')
          text = functional.read_text(encoding='utf-8')
          text = text.replace(".replace('%', '')", ".replaceAll('%', '')")
          functional.write_text(text, encoding='utf-8')

          app = Path('js/ui/app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              "value=\"${wizard.noticedAt||''}\"",
              "value=\"${esc(wizard.noticedAt||'')}\""
          )
          text = text.replace(
              'persistido em localStorage. O que',
              'persistido em armazenamento local. O que'
          )
          # Completa a entidade HTML se a variante sem ponto e vírgula estiver presente.
          text = text.replace("'\"':'&quot'", "'\"':'&quot;'")
          app.write_text(text, encoding='utf-8')
          PY
      - name: Regression and focused security tests
        run: |
          set -euo pipefail
          node --check js/ui/app.js
          node --check js/methodology/functional-calc.js
          node tests/store-regression.test.mjs
          node tests/functional-calc-regression.test.mjs
          python - <<'PY'
          from pathlib import Path
          js_files = list(Path('js').rglob('*.js'))
          owners = [str(p) for p in js_files if 'localStorage.' in p.read_text(encoding='utf-8')]
          if owners != ['js/core/store.js']:
              raise SystemExit(f'localStorage ownership regression remains: {owners}')
          app = Path('js/ui/app.js').read_text(encoding='utf-8')
          if 'value="${wizard.noticedAt||\'\'}"' in app:
              raise SystemExit('Unescaped wizard date remains in innerHTML sink')
          if "replace('%', '')" in Path('js/methodology/functional-calc.js').read_text(encoding='utf-8'):
              raise SystemExit('Incomplete percent replacement remains')
          print('Targeted governance checks passed.')
          PY
      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo 'No remediation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/app.js js/methodology/functional-calc.js
          git commit -m 'fix: remediate PR 86 security and regression findings'
          git push origin HEAD:claude/platform-maturity-analysis-aniroa

# Revisão automatizada em dois modelos (OpenAI GPT + Anthropic Claude), em paralelo.
#
# Pré-requisitos — configure somente após os gates deste workflow ficarem verdes:
#   secrets:   OPENAI_API_KEY, ANTHROPIC_API_KEY
#   variables (opcionais): OPENAI_REVIEW_MODEL, CLAUDE_REVIEW_MODEL
#
# O diff é preparado uma única vez e entregue byte a byte aos dois revisores.
# Mudanças exclusivamente documentais não geram chamadas pagas de IA.
name: AI dual-model review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip_ai: ${{ steps.prepare.outputs.skip_ai }}
      truncated: ${{ steps.prepare.outputs.truncated }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Prepare canonical review input
        id: prepare
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          REVIEW_BEFORE_SHA: ${{ github.event.before || '' }}
        run: node .github/scripts/prepare-review.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: review-input
          path: ai-review-input
          if-no-files-found: error
          retention-days: 14

  gpt-review:
    needs: prepare
    if: needs.prepare.outputs.skip_ai != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: review-input
          path: ai-review-input
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Call OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5' }}
          OPENAI_MAX_COMPLETION_TOKENS: ${{ vars.OPENAI_MAX_COMPLETION_TOKENS || '6000' }}
        run: node ai-review-input/review-openai.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gpt-findings
          path: ai-review-out/openai-findings.md
          if-no-files-found: warn
          retention-days: 14

  claude-review:
    needs: prepare
    if: needs.prepare.outputs.skip_ai != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: review-input
          path: ai-review-input
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Call Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5' }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT || 'high' }}
          CLAUDE_MAX_TOKENS: ${{ vars.CLAUDE_MAX_TOKENS || '16000' }}
        run: node ai-review-input/review-claude.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: claude-findings
          path: ai-review-out/claude-findings.md
          if-no-files-found: warn
          retention-days: 14

  post-comment:
    needs: [prepare, gpt-review, claude-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: review-input
          path: ai-review-input
      - uses: actions/download-artifact@v5
        if: needs.gpt-review.result != 'skipped'
        continue-on-error: true
        with:
          name: gpt-findings
          path: findings/gpt
      - uses: actions/download-artifact@v5
        if: needs.claude-review.result != 'skipped'
        continue-on-error: true
        with:
          name: claude-findings
          path: findings/claude
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- medper-ai-dual-review -->';
            const MAX_COMMENT_CHARS = 60000;
            const MAX_FINDING_CHARS = 25000;
            const MAX_PATH_SUMMARY_CHARS = 3000;
            const MAX_PATHS_SUMMARIZED = 60;
            const read = (path, fallback) => {
              try { return fs.readFileSync(path, 'utf8'); }
              catch { return fallback; }
            };
            const readJson = (path, fallback) => {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch { return fallback; }
            };
            const capFinding = (text, provider) => {
              const value = String(text || '');
              if (value.length <= MAX_FINDING_CHARS) return value;
              const notice = `\n\n_⚠️ Resultado truncado no comentário para ${provider}; o artefato do job preserva a resposta integral desta execução._`;
              return `${value.slice(0, Math.max(0, MAX_FINDING_CHARS - notice.length))}${notice}`;
            };
            const summarizePaths = paths => {
              const values = Array.isArray(paths) ? paths.map(String) : [];
              const visible = [];
              for (const path of values.slice(0, MAX_PATHS_SUMMARIZED)) {
                const token = `\`${path}\``;
                const candidate = [...visible, token].join(', ');
                if (candidate.length > MAX_PATH_SUMMARY_CHARS) break;
                visible.push(token);
              }
              const rendered = visible.join(', ');
              const remaining = values.length - visible.length;
              if (remaining > 0) {
                const suffix = ` … (+${remaining} caminho(s))`;
                const room = Math.max(0, MAX_PATH_SUMMARY_CHARS - suffix.length);
                return `${rendered.slice(0, room)}${suffix}`;
              }
              return rendered || 'nenhum identificado';
            };
            const capReviewBody = text => {
              if (text.length <= MAX_COMMENT_CHARS) return text;
              const notice = '\n\n_⚠️ Resultado truncado no comentário pelo teto de segurança do MedPer; consulte os artefatos dos jobs para o conteúdo integral._';
              return `${text.slice(0, Math.max(0, MAX_COMMENT_CHARS - notice.length))}${notice}`;
            };
            const prepare_failure = {
              prepare_failure: true,
              base_sha: context.payload.pull_request?.base?.sha || context.payload.before || '',
              head_sha: context.payload.pull_request?.head?.sha || context.payload.after || context.sha,
              range_source: 'unavailable',
              changed_paths_count: 0,
              changed_paths: [],
              included_paths: [],
              partial_path: '',
              omitted_paths: [],
              skip_ai: true,
              skip_reason: 'prepare-failed',
              truncated: false,
              original_bytes: 0,
              review_bytes: 0,
              limit_bytes: 60000
            };
            const meta = readJson('ai-review-input/meta.json', prepare_failure);
            const skipped = meta.prepare_failure
              ? '_Revisão de IA não executada porque o job `prepare` não produziu uma entrada canônica. Consulte os logs do workflow._'
              : meta.skip_ai
                ? `_Revisão de IA não executada: ${meta.skip_reason}. Nenhuma chamada paga foi feita._`
                : '_Sem resultado (job não concluiu ou artefato ausente)._';
            const gptRaw = read('findings/gpt/openai-findings.md', skipped);
            const claudeRaw = read('findings/claude/claude-findings.md', skipped);
            const gpt = capFinding(gptRaw, 'GPT');
            const claude = capFinding(claudeRaw, 'Claude');
            const eventLabel = context.eventName === 'pull_request' ? 'Pull Request' : 'push para main';
            const range = `${String(meta.base_sha).slice(0, 7)}…${String(meta.head_sha).slice(0, 7)}`;
            const coverage = meta.truncated
              ? ` Parcial: \`${meta.partial_path || 'não identificado'}\`. Omitidos: ${summarizePaths(meta.omitted_paths)}.`
              : '';
            const inputStatus = meta.prepare_failure
              ? '⚠️ **Entrada canônica indisponível:** o job `prepare` falhou antes de publicar `meta.json`.'
              : meta.truncated
                ? `⚠️ **Diff truncado:** ${meta.original_bytes} bytes no original; ${meta.review_bytes} bytes enviados a cada revisor (limite ${meta.limit_bytes}).${coverage}`
                : `Diff completo: ${meta.review_bytes} bytes enviados de forma idêntica aos dois revisores.`;

            const rawBody = [
              marker,
              '### 🤖 Revisão automatizada — GPT + Claude',
              '',
              `Disparada por: ${eventLabel} · intervalo \`${range}\` · ${meta.changed_paths_count} arquivo(s) alterado(s)`,
              inputStatus,
              meta.skip_ai && !meta.prepare_failure ? `IA ignorada: \`${meta.skip_reason}\`.` : '',
              '',
              '#### GPT',
              gpt,
              '',
              '#### Claude',
              claude,
              '',
              '---',
              '_Gerado automaticamente por `.github/workflows/ai-review.yml`. Achados de IA são governança de repositório: não substituem revisão humana, não alteram estado de caso e não produzem conclusão médico-pericial._'
            ].filter(Boolean).join('\n');
            const body = capReviewBody(rawBody);

            async function upsertPrComment(issueNumber, commentBody) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              const existing = comments.find(comment =>
                typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }

            if (context.eventName === 'pull_request') {
              await upsertPrComment(context.payload.pull_request.number, body);
              return;
            }

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            if (prs.length > 0) {
              await upsertPrComment(prs[0].number, `**Auditoria pós-merge**\n\n${body}`);
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `**Auditoria pós-merge (push direto, sem PR associada)**\n\n${body}`
              });
            }

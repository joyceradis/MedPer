name: MedPer V2 operational browser acceptance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "tests/browser/**"
      - "app.html"
      - "js/v2/**"
      - "css/v2.css"
      - "css/v2-premium.css"
      - ".github/workflows/medper-browser-journeys.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perita-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare Chromium test runner
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Exercise synthetic medico-legal journey without real data
        env:
          E2E_ARTIFACT_DIR: test-artifacts/medper
        run: python -m unittest discover -s tests/browser -p "test_*.py" -v
      - name: Save desktop/mobile screenshots and errors
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medper-v2-browser-evidence
          path: test-artifacts/medper/
          if-no-files-found: warn
          retention-days: 3

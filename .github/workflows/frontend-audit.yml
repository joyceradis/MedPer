name: Frontend audit

on:
  push:
    branches: [main]
    paths: ['index.html','app.html','package.json','ROADMAP.md','docs/**','css/**','js/**','tests/**','sw.js','manifest.webmanifest','icon.svg','.github/workflows/**']
  pull_request:
    paths: ['index.html','app.html','package.json','ROADMAP.md','docs/**','css/**','js/**','tests/**','sw.js','manifest.webmanifest','icon.svg','.github/workflows/**']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Run canonical syntax and regression audit
        run: npm run audit

      - name: Validate MedPer V2 application composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          v2 = Path('js/v2/app.js').read_text(encoding='utf-8')
          model = Path('js/v2/case-record.js').read_text(encoding='utf-8')
          repository = Path('js/v2/repository.js').read_text(encoding='utf-8')
          router = Path('js/v2/method-router.js').read_text(encoding='utf-8')
          document = Path('js/v2/document.js').read_text(encoding='utf-8')

          if '#071d37' not in app:
              raise SystemExit('Application theme-color drifted from canonical navy.')
          required_assets = ['./css/v2.css','./js/v2/app.js','./js/v2/case-record.js','./js/v2/repository.js','./js/v2/method-router.js','./js/v2/document.js','./js/methodology/aipe.js','./js/methodology/posas.js','./icon.svg']
          missing = [x for x in required_assets if x not in sw]
          if missing:
              raise SystemExit(f'V2 assets absent from service worker shell: {missing}')
          required_steps=['Resumo','Objeto e contexto','Autos e fontes','Cronologia','História e antecedentes','Exame pericial','Método e instrumentos','Análise médico-pericial','Quesitos','Conclusão','Documento final']
          missing=[x for x in required_steps if x not in v2]
          if missing:
              raise SystemExit(f'V2 workspace steps missing: {missing}')
          for token in ['schemaVersion','evidenceClaims','questions','conclusion']:
              if token not in model: raise SystemExit(f'Canonical CaseRecord missing: {token}')
          for token in ['indexedDB','localStorage','export','import']:
              if token not in repository: raise SystemExit(f'Local repository capability missing: {token}')
          if 'aipe' not in router or 'posas' not in router:
              raise SystemExit('Contextual aesthetic methodology routing missing.')
          if '@page' not in document or 'A4' not in document:
              raise SystemExit('A4 document composition missing.')
          print('MedPer V2 composition validated.')
          PY

      - name: Validate public/application separation and offline shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          public_html=Path('index.html').read_text(encoding='utf-8')
          app_html=Path('app.html').read_text(encoding='utf-8')
          manifest=Path('manifest.webmanifest').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          def local(ref): return ref.split('?',1)[0].split('#',1)[0]
          scripts=[local(x) for x in re.findall(r'<script[^>]+src="([^"]+)"',app_html)]
          if scripts != ['./js/v2/app.js']:
              raise SystemExit(f'Unexpected V2 application entrypoints: {scripts}')
          if re.findall(r'<script[^>]+src="([^"]+)"',public_html):
              raise SystemExit('Public site loads application scripts.')
          if './app.html' not in public_html:
              raise SystemExit('Public site has no application link.')
          if '"start_url": "./app.html"' not in manifest:
              raise SystemExit('PWA start_url must remain app.html.')
          if "'./app.html'" not in sw or "'./index.html'" not in sw:
              raise SystemExit('Offline application/public fallbacks are missing.')
          print('Public/application separation and V2 offline shell validated.')
          PY

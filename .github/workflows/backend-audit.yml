name: Backend audit

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-audit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        env:
          MEDPER_JWT_SECRET: test-secret-that-is-longer-than-32-bytes
        run: pytest -q

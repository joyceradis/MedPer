name: Authentication audit

on:
  push:
    branches: [main]
    paths:
      - 'js/auth/**'
      - 'js/config/**'
      - 'css/auth.css'
      - 'supabase/**'
      - 'js/main.js'
      - 'js/v2/**'
      - 'app.html'
      - 'sw.js'
      - '.github/workflows/auth-audit.yml'
  pull_request:
    paths:
      - 'js/auth/**'
      - 'js/config/**'
      - 'css/auth.css'
      - 'supabase/**'
      - 'js/main.js'
      - 'js/v2/**'
      - 'app.html'
      - 'sw.js'
      - '.github/workflows/auth-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check authentication and V2 module syntax
        run: |
          set -euo pipefail
          node --check js/auth/auth-controller.js
          node --check js/config/supabase-config.js
          node --check js/main.js
          node --check js/v2/app.js
          node --check js/v2/repository.js
      - name: Check browser key safety and local-first boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          auth=Path('js/auth/auth-controller.js').read_text(encoding='utf-8')
          config=Path('js/config/supabase-config.js').read_text(encoding='utf-8')
          main=Path('js/main.js').read_text(encoding='utf-8')
          v2=Path('js/v2/app.js').read_text(encoding='utf-8')
          repo=Path('js/v2/repository.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          app=Path('app.html').read_text(encoding='utf-8')

          forbidden=['service_role','SUPABASE_SERVICE_ROLE','secretKey']
          exposed=[x for x in forbidden if x in config or x in v2 or x in app]
          if exposed: raise SystemExit(f'Secret-like values in browser surface: {exposed}')

          required_auth=['signInWithPassword','signUp','signInWithOAuth','getSession','onAuthStateChange','create_personal_organization','signOut']
          missing=[x for x in required_auth if x not in auth]
          if missing: raise SystemExit(f'Legacy authentication behavior missing: {missing}')

          required_main=['createAuthController','startApplication','onAccessGranted:startApplication','onAccessRevoked','createApp']
          missing=[x for x in required_main if x not in main]
          if missing: raise SystemExit(f'Legacy authentication implementation damaged: {missing}')

          if './js/v2/app.js' not in app:
              raise SystemExit('V2 entrypoint missing from app.html.')
          if 'medper-api-url' in app or 'replit.app' in app.lower():
              raise SystemExit('V2 must not require a hard-coded remote API.')
          if 'CaseRepository' not in v2 or 'indexedDB' not in repo or 'localStorage' not in repo:
              raise SystemExit('Local-first repository boundary is missing.')

          required_v2_assets=['./js/v2/app.js','./js/v2/repository.js','./css/v2.css']
          missing=[x for x in required_v2_assets if x not in sw]
          if missing: raise SystemExit(f'V2 assets absent from PWA shell: {missing}')
          if './js/auth/auth-controller.js' in app or './css/auth.css' in app:
              raise SystemExit('V2 app unexpectedly depends on legacy auth at startup.')
          print('Legacy auth safety preserved and V2 local-first boundary validated.')
          PY
      - name: Check database schema isolation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          schema=Path('supabase/schema.sql').read_text(encoding='utf-8')
          bootstrap=Path('supabase/002_bootstrap_organization.sql').read_text(encoding='utf-8')
          required=['create table public.profiles','create table public.organizations','create table public.organization_members','create table public.cases','enable row level security','auth.uid()','cases_select_allowed','cases_insert_owner','organization_can_use']
          missing=[x for x in required if x not in schema]
          if missing: raise SystemExit(f'Database protections missing: {missing}')
          if 'security definer' not in bootstrap or 'create_personal_organization' not in bootstrap:
              raise SystemExit('Organization bootstrap RPC is missing or unsafe.')
          print('Optional multi-tenant schema and RLS safeguards validated.')
          PY

name: Published MedPer entrance smoke (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/live/**"
      - ".github/workflows/medper-published-entry.yml"
      - "app.html"
      - "index.html"
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * *"

permissions:
  contents: read

jobs:
  published-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated browser smoke runner
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Check actual public landing and V2 demo without writing data
        run: python -m unittest discover -s tests/live -p "test_*.py" -v
      - name: Save published-site screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medper-public-entry-evidence
          path: test-artifacts/production/
          if-no-files-found: warn
          retention-days: 3

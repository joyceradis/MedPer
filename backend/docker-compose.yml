services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medper
      POSTGRES_USER: medper_owner
      POSTGRES_PASSWORD: dev-owner-password
    volumes: [medper_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medper_owner -d medper"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      MEDPER_DATABASE_URL: postgresql+psycopg://medper_owner:dev-owner-password@db:5432/medper
      MEDPER_JWT_SECRET: change-this-secret-to-at-least-32-random-bytes
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  medper_db: {}

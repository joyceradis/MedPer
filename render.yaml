services:
  - type: web
    name: medper-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: MEDPER_DATABASE_URL
        fromDatabase:
          name: medper-postgres
          property: connectionString
      - key: MEDPER_JWT_SECRET
        generateValue: true
      - key: MEDPER_FILE_ENCRYPTION_KEY
        sync: false
      - key: MEDPER_CORS_ORIGINS
        value: https://joyceradis.github.io
      - key: MEDPER_PUBLIC_API_URL
        sync: false
      - key: MEDPER_STORAGE_PATH
        value: /var/data/medper-files
    disk:
      name: medper-files
      mountPath: /var/data
      sizeGB: 10
    preDeployCommand: alembic upgrade head

databases:
  - name: medper-postgres
    databaseName: medper
    user: medper_owner
    plan: basic-256mb
    ipAllowList: []

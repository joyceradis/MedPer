# OPTIONAL free-only PREVIEW blueprint. Never deploy real clinical/judicial data here.
# No paid disk and no paid database resource will be provisioned by this file.
# Backend remains intentionally disabled until a separate durable PostgreSQL
# service and encryption keys are configured and reviewed.
services:
  - type: web
    name: medper-api-preview
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: MEDPER_ENVIRONMENT
        value: production
      - key: MEDPER_PROFESSIONAL_ENABLED
        value: "false"
      - key: MEDPER_GOOGLE_SELF_SIGNUP_ENABLED
        value: "false"
      - key: MEDPER_GOOGLE_CLIENT_ID
        sync: false
      - key: MEDPER_FILE_STORAGE_REQUIRED
        value: "true"
      - key: MEDPER_DATABASE_URL
        sync: false
      - key: MEDPER_JWT_SECRET
        generateValue: true
      - key: MEDPER_FILE_ENCRYPTION_KEY
        sync: false
      - key: MEDPER_CORS_ORIGINS
        value: https://joyceradis.github.io
      - key: MEDPER_PUBLIC_API_URL
        sync: false
      - key: MEDPER_STORAGE_PATH
        value: /tmp/medper-preview-files
